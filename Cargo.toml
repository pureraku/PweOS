[package]
name = "pweos"
version = "0.1.0"
edition = "2021"
description = "A lightweight 32-bit x86 educational operating system ported to Rust"

[lib]
name = "pweos"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
